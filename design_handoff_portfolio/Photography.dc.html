<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<script src="./ds-base.js"></script>
<script src="./image-slot.js"></script>
<script>try{var t=localStorage.getItem('mg-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
@keyframes mg-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes mg-fade{from{opacity:0}to{opacity:1}}
@keyframes mg-nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(7px)}}
a{color:var(--link);text-decoration:none}
a:hover{color:var(--link-hover)}
.mg-strip::-webkit-scrollbar{height:8px}
.mg-strip::-webkit-scrollbar-thumb{background:#3a3323;border-radius:99px}
</style>
</helmet>
<div style="min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font-sans)">
  <header style="position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:color-mix(in oklab,var(--bg) 80%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:12px">
      <x-import component-from-global-scope="MikeGuerreroDesignSystem_88d503.Monogram" size="36" hint-size="36px,36px"></x-import>
      <span style="font-family:var(--font-display);font-size:19px;color:var(--text-strong)">Mike Guerrero</span>
    </a>
    <nav style="display:flex;align-items:center;gap:22px">
      <a href="About.dc.html" style="font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)" style-hover="color:var(--primary)">About</a>
      <a href="Experience.dc.html" style="font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)" style-hover="color:var(--primary)">Experience</a>
      <a href="Projects.dc.html" style="font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)" style-hover="color:var(--primary)">Projects</a>
      <a href="Photography.dc.html" style="font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--primary)">Photography</a>
      <a href="Writings.dc.html" style="font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)" style-hover="color:var(--primary)">Writings</a>
      <x-import component-from-global-scope="MikeGuerreroDesignSystem_88d503.ThemeToggle" theme="{{ theme }}" onChange="{{ onThemeChange }}" hint-size="72px,34px"></x-import>
    </nav>
  </header>

  <section style="max-width:1088px;margin:0 auto;padding:60px 24px 8px;animation:mg-rise .6s ease-out both">
    <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap">
      <div>
        <span style="font-family:var(--font-mono);font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--text-faint)">04 &middot; 35mm</span>
        <h1 style="font-family:var(--font-display);font-size:clamp(40px,7vw,72px);line-height:1.03;margin:12px 0 12px;color:var(--text-strong)">Shot on film</h1>
        <p style="font-size:17px;line-height:1.65;color:var(--text-muted);max-width:520px;margin:0">A roll from the Bay to the beach. Scroll the strip sideways, or tap a frame to blow it up.</p>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <button onClick="{{ scrollPrev }}" aria-label="Previous" style="width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface-raised);color:var(--text);font-size:16px;cursor:pointer">&larr;</button>
        <button onClick="{{ scrollNext }}" aria-label="Next" style="width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surface-raised);color:var(--text);font-size:16px;cursor:pointer">&rarr;</button>
        <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--text-faint);display:inline-flex;align-items:center;gap:6px">DRAG<span style="animation:mg-nudge 1.6s ease-in-out infinite">&rarr;</span></span>
      </div>
    </div>
  </section>

  <div id="filmstrip" class="mg-strip" style="margin-top:26px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x proximity;background:#0c0a06;border-top:1px solid #1c150c;border-bottom:1px solid #1c150c">
    <div aria-hidden="true" style="position:relative"></div>
    <div style="display:flex;align-items:stretch;gap:0;padding:0 max(24px,calc(50vw - 540px));width:max-content">
      <sc-for list="{{ frames }}" as="f" hint-placeholder-count="5">
        <figure onClick="{{ f.open }}" style="scroll-snap-align:center;margin:0;flex:0 0 auto;width:min(62vw,560px);padding:0 10px;cursor:pointer">
          <div aria-hidden="true" style="height:28px;background:repeating-linear-gradient(to right,#0c0a06 0 16px,#e9dcbb 16px 30px,#0c0a06 30px 46px)"></div>
          <div style="position:relative;height:min(52vh,440px);background:#000;overflow:hidden">
            <img src="{{ f.src }}" alt="{{ f.caption }}" style="width:100%;height:100%;object-fit:cover;transition:transform .5s ease-out" style-hover="transform:scale(1.04)"/>
            <div aria-hidden="true" style="position:absolute;inset:0;background-image:var(--grain);mix-blend-mode:overlay;opacity:0.4;pointer-events:none"></div>
            <div style="position:absolute;left:14px;bottom:12px;font-family:var(--font-mono);font-size:13px;color:#ff8a3d;text-shadow:0 0 10px rgba(255,90,30,.6)">{{ f.date }}</div>
            <div style="position:absolute;right:14px;top:12px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.2em;color:rgba(246,220,172,.75)">FRAME {{ f.no }}</div>
          </div>
          <div aria-hidden="true" style="height:28px;background:repeating-linear-gradient(to right,#0c0a06 0 16px,#e9dcbb 16px 30px,#0c0a06 30px 46px)"></div>
          <figcaption style="padding:12px 2px 22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px">
            <span style="font-family:var(--font-display);font-size:19px;color:#f6dcac">{{ f.caption }}</span>
            <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:#b7a886;white-space:nowrap">{{ f.place }}</span>
          </figcaption>
        </figure>
      </sc-for>
      <div style="scroll-snap-align:center;flex:0 0 auto;width:min(50vw,380px);padding:0 10px;display:flex;flex-direction:column;justify-content:center">
        <div style="aspect-ratio:4/3;border-radius:4px;overflow:hidden"><image-slot id="photo-extra-1" shape="rect" placeholder="Drop your own frame"></image-slot></div>
        <p style="font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;color:#b7a886;text-align:center;margin:14px 0 0">ADD TO THE ROLL</p>
      </div>
    </div>
  </div>

  <section style="max-width:1088px;margin:0 auto;padding:40px 24px 90px;text-align:center">
    <span style="font-family:var(--font-mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--text-faint)">Kodak Gold 200 &middot; Canon AE-1 &middot; San Diego</span>
  </section>

  <sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ closeLb }}" style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:32px;background:rgba(8,6,3,.92);animation:mg-fade .2s ease-out both">
      <button onClick="{{ closeLb }}" aria-label="Close" style="position:absolute;top:18px;right:22px;width:38px;height:38px;border-radius:50%;border:1px solid #4a4232;background:#14110b;color:#f6dcac;font-size:18px;cursor:pointer">&times;</button>
      <div onClick="{{ stop }}" style="position:relative;max-width:min(1100px,92vw);max-height:74vh;display:flex;align-items:center;gap:16px">
        <button onClick="{{ lbPrev }}" aria-label="Previous" style="flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1px solid #4a4232;background:rgba(20,17,11,.8);color:#f6dcac;font-size:18px;cursor:pointer">&larr;</button>
        <div style="position:relative;border:12px solid #0c0a06;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)">
          <img src="{{ cur.src }}" alt="{{ cur.caption }}" style="display:block;max-width:78vw;max-height:66vh;object-fit:contain"/>
          <div aria-hidden="true" style="position:absolute;inset:0;background-image:var(--grain);mix-blend-mode:overlay;opacity:0.35;pointer-events:none"></div>
          <div style="position:absolute;left:14px;bottom:12px;font-family:var(--font-mono);font-size:14px;color:#ff8a3d;text-shadow:0 0 12px rgba(255,90,30,.6)">{{ cur.date }}</div>
        </div>
        <button onClick="{{ lbNext }}" aria-label="Next" style="flex:0 0 auto;width:46px;height:46px;border-radius:50%;border:1px solid #4a4232;background:rgba(20,17,11,.8);color:#f6dcac;font-size:18px;cursor:pointer">&rarr;</button>
      </div>
      <div onClick="{{ stop }}" style="text-align:center">
        <p style="font-family:var(--font-display);font-size:24px;margin:0;color:#f6dcac">{{ cur.caption }}</p>
        <p style="font-family:var(--font-mono);font-size:12px;letter-spacing:.1em;margin:6px 0 0;color:#b7a886">{{ cur.place }}</p>
      </div>
    </div>
  </sc-if>

  <dc-import name="SiteFooter" active="photography" heading="Keep exploring" hint-size="100%,760px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: (() => { try { return localStorage.getItem('mg-theme') || 'light'; } catch(e){ return 'light'; } })(), lb: null };
  PHOTOS = [
    { src:'assets/sf_sunset.jpg', caption:'Golden hour', place:'San Francisco', date:'07 \u00b7 25', no:'01' },
    { src:'assets/fruitvale_bart.jpg', caption:'Last train', place:'Fruitvale, Oakland', date:'05 \u00b7 25', no:'02' },
    { src:'assets/flight_clouds.jpg', caption:'Somewhere over', place:'35,000 ft', date:'03 \u00b7 25', no:'03' },
    { src:'assets/mike.jpg', caption:'Self, at the shore', place:'San Diego', date:'01 \u00b7 25', no:'04' }
  ];
  componentDidMount(){
    this._key = (e) => {
      if(this.state.lb == null) return;
      if(e.key === 'Escape') this.setState({ lb: null });
      if(e.key === 'ArrowRight') this.setState(s => ({ lb: (s.lb + 1) % this.PHOTOS.length }));
      if(e.key === 'ArrowLeft') this.setState(s => ({ lb: (s.lb - 1 + this.PHOTOS.length) % this.PHOTOS.length }));
    };
    document.addEventListener('keydown', this._key);
  }
  componentWillUnmount(){ document.removeEventListener('keydown', this._key); }
  _scroll(dir){ const el = document.getElementById('filmstrip'); if(el) el.scrollBy({ left: dir * Math.min(560, el.clientWidth * 0.8), behavior:'smooth' }); }
  renderVals(){
    const cur = this.state.lb == null ? {} : this.PHOTOS[this.state.lb];
    return {
      theme: this.state.theme,
      onThemeChange: (t) => { try { localStorage.setItem('mg-theme', t); } catch(e){} this.setState({ theme: t }); },
      frames: this.PHOTOS.map((p, i) => ({ ...p, open: () => this.setState({ lb: i }) })),
      lightboxOpen: this.state.lb != null,
      cur,
      closeLb: () => this.setState({ lb: null }),
      lbPrev: () => this.setState(s => ({ lb: (s.lb - 1 + this.PHOTOS.length) % this.PHOTOS.length })),
      lbNext: () => this.setState(s => ({ lb: (s.lb + 1) % this.PHOTOS.length })),
      scrollPrev: () => this._scroll(-1),
      scrollNext: () => this._scroll(1),
      stop: (e) => e.stopPropagation()
    };
  }
}
</script>
</body>
</html>
